# /etc/nginx/sites-available/website  (replace example.ae; certificates via certbot)
server {
  listen 80;
  server_name example.ae www.example.ae;
  return 301 https://example.ae$request_uri;
}

server {
  listen 443 ssl http2;
  server_name www.example.ae;
  ssl_certificate     /etc/letsencrypt/live/example.ae/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.ae/privkey.pem;
  return 301 https://example.ae$request_uri;
}

server {
  listen 443 ssl http2;
  server_name example.ae;
  ssl_certificate     /etc/letsencrypt/live/example.ae/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.ae/privkey.pem;

  client_max_body_size 25m;   # media uploads (20 MB) and inquiry attachments (10 MB)

  # The Node app sets security, compression and cache headers; Nginx only proxies.
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
